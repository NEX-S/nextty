[package]
name = "nextty"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/NEX-S/nextty"
description = "A small GPU-accelerated Linux terminal"

[features]
default = ["gui", "tui"]
gui = []
tui = []

[dependencies]
memchr = "2"
curl = { version = "0.4", default-features = false }
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
smallvec = { version = "1.16", features = ["union"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
