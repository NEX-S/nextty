</style><main><header><div><div class="eyebrow">NEXTTY / IDENTITY STUDIES / 2026</div><h1>精密，安静，有力量。</h1><p>六款极简工业图标 · 石墨机身 / 切角轮廓 / 低饱和信号色<br>点击选中方案，再把编号告诉我；下面的小尺寸就是实际显示大小。</p></div><div class="switch"><button onclick="document.body.classList.remove('light')">深色背景</button><button onclick="document.body.classList.add('light')">浅色背景</button></div></header><section class="grid"><button class="card" onclick="choose('01', '折锋')" aria-label="选择 01 折锋" data-id="01"><div class="meta"><span>01 / Cut / Prompt</span><span class="select">选择 ↗</span></div><div class="hero"><img src="01.svg" alt="折锋 图标" width="168" height="168"></div><div class="name">折锋</div><p>切削斜面与单一提示符。最接近终端本身，克制、清晰。</p><div class="sizes"><img src="01.svg" width="48" height="48"><img src="01.svg" width="32" height="32"><img src="01.svg" width="24" height="24"><img src="01.svg" width="16" height="16"><span>48 · 32 · 24 · 16 px</span></div></button><button class="card" onclick="choose('02', '负形 N')" aria-label="选择 02 负形 N" data-id="02"><div class="meta"><span>02 / Negative / Monogram</span><span class="select">选择 ↗</span></div><div class="hero"><img src="02.svg" alt="负形 N 图标" width="168" height="168"></div><div class="name">负形 N</div><p>用斜向留白切出 N，强调 next 的推进感。</p><div class="sizes"><img src="02.svg" width="48" height="48"><img src="02.svg" width="32" height="32"><img src="02.svg" width="24" height="24"><img src="02.svg" width="16" height="16"><span>48 · 32 · 24 · 16 px</span></div></button><button class="card" onclick="choose('03', '并行')" aria-label="选择 03 并行" data-id="03"><div class="meta"><span>03 / Parallel / Workspace</span><span class="select">选择 ↗</span></div><div class="hero"><img src="03.svg" alt="并行 图标" width="168" height="168"></div><div class="name">并行</div><p>两条加工轨道与端点，呼应多 pane 与持久会话。</p><div class="sizes"><img src="03.svg" width="48" height="48"><img src="03.svg" width="32" height="32"><img src="03.svg" width="24" height="24"><img src="03.svg" width="16" height="16"><span>48 · 32 · 24 · 16 px</spa
