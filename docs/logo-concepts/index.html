</style><header><div class="brand">nextty<span>_</span></div><div class="meta">DESKTOP ICON EXPLORATIONS / 01—06</div></header><main><section class="intro"><div><h1>为下一次输入，留下一个标记。</h1><p>6 个桌面图标方向 · 点击选择，查看实际尺寸与 Dock 效果</p></div><div class="switch" aria-label="图标预览背景"><button class="on" data-theme="light">浅色背景</button><button data-theme="dark">深色背景</button></div></section><div class="layout"><div class="grid"><button class="concept active" data-index="0" aria-pressed="true"><div class="cardtop"><span>01</span><span class="indicator">已选预览</span></div><div class="art"><img src="01-prompt.svg" alt="光标 / Prompt" /></div><h2>光标 / Prompt</h2><p>终端提示符与明亮光标。直接、清晰，最贴近终端本身。</p></button><button class="concept " data-index="1" aria-pressed="false"><div class="cardtop"><span>02</span><span class="indicator">点击预览</span></div><div class="art"><img src="02-next.svg" alt="向前 / Next" /></div><h2>向前 / Next</h2><p>把 N 压缩成向前的折线，兼具快捷键和执行感。</p></button><button class="concept " data-index="2" aria-pressed="false"><div class="cardtop"><span>03</span><span class="indicator">点击预览</span></div><div class="art"><img src="03-workspace.svg" alt="分屏 / Workspace" /></div><h2>分屏 / Workspace</h2><p>用工作区分割线和提示符表达多窗格终端。</p></button><button class="concept " data-index="3" aria-pressed="false"><div class="cardtop"><span>04</span><span class="indicator">点击预览</span></div><div class="art"><img src="04-link.svg" alt="连线 / Link" /></div><h2>连线 / Link</h2><p>两端相接的端口，呼应本地与远程工作区。</p></button><button class="concept " data-index="4" aria-pressed="false"><div class="cardtop"><span>05</span><span class="indicator">点击预览</span></div><div class="art"><img src="05-monogram.svg" alt="印记 / Monogram" /></div><h2>印记 / Monogram</h2><p>一笔构成 n 与终端下划线，适合长期使用的品牌标记。</p></button><button class="concept " data-index="5" aria-pressed="false"><div class="cardtop"><span>06</span><span class="indicator">点击预览</span></div><div class="art"><img src="06-signal.svg" alt="信号 / Signal" /></div><h2>信号 / Signal</h2><p>终端光标置于开放环中，表达持续运行与重新连接。</p></button></div><aside class="detail"><label>SELECTED CONCEPT / <span id="number">01</span></label><div class="preview"><img id="hero" src="01-prompt.svg" alt="当前选择：光标 / Prompt"></div><h2 id="name">光标 / Prompt</h2><p id="desc">终端提示符与明亮光标。直接、清晰，最贴近终端本身。</p><div class="label">ACTUAL PIXELS / 实际尺寸</div><div class="sizes" id="sizes"></div><div class="label">IN THE DOCK / 桌面效果</div><div class="desktop"><div class="dock"><span class="other">≡</span><span class="other">⌕</span><img id="dock" src="01-prompt.svg" alt="Dock 图标预览"><span class="other">⚙</span></div></div><a id="download" class="download" href="01-prompt.svg" download>下载此款 SVG</a><p class="footnote">矢量原稿 · 透明外边距 · 统一 256 × 256 画布<br>当前仅为设计预览，尚未替换应用图标。</p></aside></div><footer><span>NEXTTY — LINUX / WAYLAND / VULKAN</span><span>选择你喜欢的编号，继续细化。</span></footer></main><script>
const concepts=[["01-prompt", "光标 / Prompt", "终端提示符与明亮光标。直接、清晰，最贴近终端本身。"], ["02-next", "向前 / Next", "把 N 压缩成向前的折线，兼具快捷键和执行感。"], ["03-workspace", "分屏 / Workspace", "用工作区分割线和提示符表达多窗格终端。"], ["04-link", "连线 / Link", "两端相接的端口，呼应本地与远程工作区。"], ["05-monogram", "印记 / Monogram", "一笔构成 n 与终端下划线，适合长期使用的品牌标记。"], ["06-signal", "信号 / Signal", "终端光标置于开放环中，表达持续运行与重新连接。"]];const cards=[...document.querySelectorAll('.concept')];function select(i){const c=concepts[i];cards.forEach((el,n)=>{el.classList.toggle('active',n===i);el.setAttribute('aria-pressed',n===i);el.querySelector('.indicator').textContent=n===i?'已选预览':'点击预览'});document.querySelector('#number').textContent=String(i+1).padStart(2,'0');document.querySelector('#name').textContent=c[1];document.querySelector('#desc').textContent=c[2];for(const id of ['hero','dock']){const el=document.getElementById(id);el.src=c[0]+'.svg';el.alt=c[1]}document.querySelector('#download').href=c[0]+'.svg';document.querySelector('#sizes').innerHTML=[16,24,32,48,64].map(s=>`<div class="size"><img src="${c[0]}.svg" alt="${s} 像素" width="${s}" height="${s}">${s}px</div>`).join('')};cards.forEach((el,i)=>el.addEventListener('click',()=>select(i)));document.querySelectorAll('[data-theme]').forEach(el=>el.addEventListener('click',()=>{document.querySelector('.preview').classList.toggle('dark',el.dataset.theme==='dark');document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('on',x===el))}));select(0);
</script></html>
