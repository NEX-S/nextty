function render(){const q=document.getElementById('search').value.trim().toLowerCase();shown=items.filter(x=>(family==='all'||x.family===family)&&(!onlySaved||favorites.has(x.id))&&(!q||x.id.includes(q)||x.name.includes(q)||x.style.includes(q)));document.getElementById('filters').innerHTML=[['all','全部风格'],...families.map(x=>[x[0],x[1]])].map(([k,n])=>`<button class="pill ${family===k?'active':''}" onclick="filter('${k}')">${n}${k==='all'?'':' · 10'}</button>`).join('');document.getElementById('grid').classList.toggle('small',small);document.getElementById('grid').innerHTML=shown.map(x=>`<article class="card ${favorites.has(x.id)?'saved':''}"><button class="open" onclick="openDetail('${x.id}')" aria-label="预览 ${x.id} ${x.style} ${x.name}"><div class="top"><span>${x.id}</span></div><div class="art"><img loading="lazy" src="${x.file}" alt="${x.style} ${x.name}">${small?`<img loading="lazy" src="${x.file}" alt="24 像素"><img loading="lazy" src="${x.file}" alt="16 像素">`:''}</div><div class="title">${x.name}</div><div class="sub">${x.style}</div></button><button class="star" aria-label="${favorites.has(x.id)?'取消收藏':'收藏'} ${x.id}" onclick="star('${x.id}')">${favorites.has(x.id)?'★':'☆'}</button></article>`).join('');document.getElementById('status').textContent=`显示 ${shown.length} / 120 款${family==='all'?'':' · '+families.find(x=>x[0]===family)[2]}`;document.getElementById('count').textContent=`收藏 ${favorites.size} 款`;document.getElementById('ids').textContent=[...favorites].sort().join(' · ')||'点 ☆ 收藏喜欢的编号';document.getElementById('all').classList.toggle('active',!onlySaved);document.getElementById('saved').classList.toggle('active',onlySaved)}
function openDetail(id){current=items.find(x=>x.id===id);updateModal();if(!detail.open)detail.showModal()}
function updateModal(){const x=current;document.getElementById('modalname').textContent=x.id+' / '+x.style+' / '+x.name;document.getElementById('large').innerHTML=`<img src="${x.file}" alt="${x.name}">`;document.getElementById('sizes').innerHTML=[64,48,32,24,16].map(n=>`<div><img src="${x.file}" width="${n}" height="${n}" alt="${n} 像素"><span>${n} px</span></div>`).join('');const b=document.getElementById('modalstar');b.textContent=favorites.has(x.id)?'★ 已收藏':'☆ 收藏';b.onclick=()=>star(x.id);document.getElementById('source').href=x.file}
function step(n){const list=shown.length?shown:items;const at=list.findIndex(x=>x.id===current.id);openDetail(list[(at+n+list.length)%list.length].id)}
document.addEventListener('keydown',e=>{if(!detail.open)return;if(e.key==='ArrowRight'){e.preventDefault();step(1)}if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}if(e.key.toLowerCase()==='f'){e.preventDefault();star(current.id)}});detail.addEventListener('click',e=>{if(e.target===detail){const r=detail.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)detail.close()}});render();
</script></html>
