<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nextty / 十款图标 · 第二轮</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f2;color:#212429;font-family:Inter,"Noto Sans CJK SC",sans-serif}main{max-width:1460px;margin:auto;padding:36px 40px 100px}header{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid #d5d7d7;padding-bottom:24px}.kicker{font-size:11px;letter-spacing:3px;color:#737b83}h1{font-size:32px;font-weight:550;letter-spacing:-1px;margin:14px 0 10px}header p{font-size:13px;color:#737b83;margin:0;line-height:1.8}.toggle{display:flex;gap:7px}.toggle button{padding:9px 15px;border:1px solid #c9cecf;background:transparent;color:inherit;border-radius:6px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:25px}.card{background:#fff;border:1px solid #e0e3e3;color:inherit;border-radius:13px;padding:18px;text-align:left;cursor:pointer;font:inherit;transition:border-color .15s,transform .15s}.card:hover{border-color:#8c98a1;transform:translateY(-3px)}.card.chosen{border:2px solid #3483f0;padding:17px}.label{display:flex;justify-content:space-between;font:10px monospace;color:#869098}.label b{color:#4c5965}.preview{display:flex;align-items:center;justify-content:center;height:192px}h2{font-size:15px;font-weight:550;margin:0 0 9px}p{font-size:11px;line-height:1.85;color:#7b858b;min-height:42px;margin:0}.sizes{display:flex;align-items:center;gap:8px;border-top:1px solid #edf0ef;margin-top:18px;padding-top:12px;min-height:62px}.sizes span{display:none}footer{position:fixed;bottom:0;left:0;right:0;padding:17px 40px;background:#fff;border-top:1px solid #ddd;font-size:13px;display:flex;justify-content:space-between}footer span{color:#8a9399;font-size:12px}.dark{background:#171a1e;color:#e3e6e9}.dark .card{background:#23272e;border-color:#393f48}.dark .card.chosen{border-color:#609aff}.dark header,.dark .sizes{border-color:#3b424b}.dark footer{background:#23272e;border-color:#3b424b}.dark .label b{color:#b2bdc8}.dark .toggle button{border-color:#4b555e}.dark .card:first-child .preview img,.dark .card:first-child .sizes img{filter:invert(.9)}@media(max-width:1150px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){main{padding:24px 18px 100px}.grid{grid-template-columns:repeat(2,1fr)}header{display:block}.toggle{margin-top:15px}.preview{height:165px}.preview img{width:136px;height:136px}.sizes{gap:5px}.sizes img:first-child{width:40px;height:40px}footer{padding:16px 18px}footer span{display:none}}</style><main><header><div><div class="kicker">NEXTTY — ICON EXPLORATION / ROUND 02</div><h1>换一种性格。</h1><p>五种视觉语言，每种两款。去掉工业机身，比较轮廓、颜色和小尺寸辨识度。<br>点击喜欢的方案，然后在聊天里告诉我编号。</p></div><div class="toggle"><button onclick="document.body.classList.remove('dark')">浅色</button><button onclick="document.body.classList.add('dark')">深色</button></div></header><section class="grid"><button class="card" data-id="01" onclick="choose('01','扁平 · 纸白')"><div class="label"><b>01</b><span>FLAT</span></div><div class="preview"><img src="01.svg" alt="扁平 · 纸白" width="154" height="154"></div><h2>扁平 · 纸白</h2><p>黑白提示符，去掉容器，只留下终端本身。</p><div class="sizes"><img src="01.svg" width="48" height="48"><img src="01.svg" width="32" height="32"><img src="01.svg" width="24" height="24"><img src="01.svg" width="16" height="16"><span>48 / 32 / 24 / 16</span></div></button><button class="card" data-id="02" onclick="choose('02','扁平 · 青柠')"><div class="label"><b>02</b><span>FLAT</span></div><div class="preview"><img src="02.svg" alt="扁平 · 青柠" width="154" height="154"></div><h2>扁平 · 青柠</h2><p>实心几何 N；单色、有分量，适合小尺寸。</p><div class="sizes"><img src="02.svg" width="48" height="48"><img src="02.svg" width="32" height="32"><img src="02.svg" width="24" height="24"><img src="02.svg" width="16" height="16"><span>48 / 32 / 24 / 16</span></div></button><button class="card" data-id="03" onclick="choose('03','iOS · 靛蓝')"><div class="label"><b>03</b><span>IOS</span></div><div class="preview"><img src="03.svg" alt="iOS · 靛蓝" width="154" height="154"></div><h2>iOS · 靛蓝</h2><p>柔和圆角方形，白色终端符号与电蓝色。</p><div class="sizes"><img src="03.svg" width="48" height="48"><img src="03.svg" width="32" height="32"><img src="03.svg" width="24" height="24"><img src="03.svg" width="16" height="16"><span>48 / 32 / 24 / 16</span></div></button><button class="card" data-id="04" onclick="choose('04','iOS · 薄荷')"><div class="label"><b>04</b><span>IOS</span></div><div class="preview"><img src="04.svg" alt="iOS · 薄荷" width="154" height="154"></div><h2>iOS · 薄荷</h2><p>薄荷绿色与白色叠片，以留白表达 N。</p><div class="sizes"><img src="04.svg" width="48" height="48"><img src="04.svg" width="32" height="32"><img src="04.svg" width="24" height="24"><img src="04.svg" width="16" height="16"><span>48 / 32 / 24 / 16</span></div></button><button class="card" data-id="05" onclick="choose('05','JetBrains · 碰撞')"><div class="label"><b>05</b><span>JETBRAINS</span></div><div class="preview"><img src="05.svg" alt="JetBrains · 碰撞" width="154" height="154"></div><h2>JetBrains · 碰撞</h2><p>明亮色块穿插黑色标签，用 NT 建立品牌识别。</p><div class="sizes"><img src="05.svg" width="48" height="48"><img src="05.svg" width="32" height="32"><img src="05.svg" width="24" height="24"><img src="05.svg" width="16" height="16"><span>48 / 32 / 24 / 16</span></div></button><button class="card" data-id="06" onclick="choose('06','JetBrains · 光谱')"><div class="label"><b>06</b><span>JETBRAINS</span></div><div class="preview"><img src="06.svg" alt="JetBrains · 光谱" width="154" height="154"></div><h2>JetBrains · 光谱</h2><p>青蓝与紫色构成斜向光谱，黑色核心保持稳定。</p><div class="sizes"><img src="06.svg" width="48" height="48"><img src="06.svg" width="32" height="32"><img src="06.svg" width="24" height="24"><img src="06.svg" width="16" height="16"><span>48 / 32 / 24 / 16</span></div></button><button class="card" data-id="07" onclick="choose('07','VS Code · 蓝色折带')"><div class="label"><b>07</b><span>VSCODE</span></div><div class="preview"><img src="07.svg" alt="VS Code · 蓝色折带" width="154" height="154"></div><h2>VS Code · 蓝色折带</h2><p>开放的蓝色折带构成 N，轮廓轻盈，没有底板。</p><div class="sizes"><img src="07.svg" width="48" height="48"><img src="07.svg" width="32" height="32"><img src="07.svg" width="24" height="24"><img src="07.svg" width="16" height="16"><span>48 / 32 / 24 / 16</span></div></button><button class="card" data-id="08" onclick="choose('08','VS Code · 提示折带')"><div class="label"><b>08</b><span>VSCODE</span></div><div class="preview"><img src="08.svg" alt="VS Code · 提示折带" width="154" height="154"></div><h2>VS Code · 提示折带</h2><p>将提示箭头变成闭合折带，强调轮廓辨识。</p><div class="sizes"><img src="08.svg" width="48" height="48"><img src="08.svg" width="32" height="32"><img src="08.svg" width="24" height="24"><img src="08.svg" width="16" height="16"><span>48 / 32 / 24 / 16</span></div></button><button class="card" data-id="09" onclick="choose('09','Sublime · 琥珀')"><div class="label"><b>09</b><span>SUBLIME</span></div><div class="preview"><img src="09.svg" alt="Sublime · 琥珀" width="154" height="154"></div><h2>Sublime · 琥珀</h2><p>深灰底板和暖橙色折片，温暖、直接。</p><div class="sizes"><img src="09.svg" width="48" height="48"><img src="09.svg" width="32" height="32"><img src="09.svg" width="24" height="24"><img src="09.svg" width="16" height="16"><span>48 / 32 / 24 / 16</span></div></button><button class="card" data-id="10" onclick="choose('10','Sublime · 终端')"><div class="label"><b>10</b><span>SUBLIME</span></div><div class="preview"><img src="10.svg" alt="Sublime · 终端" width="154" height="154"></div><h2>Sublime · 终端</h2><p>暖橙色块与锐利提示符，更明确地表达 terminal。</p><div class="sizes"><img src="10.svg" width="48" height="48"><img src="10.svg" width="32" height="32"><img src="10.svg" width="24" height="24"><img src="10.svg" width="16" height="16"><span>48 / 32 / 24 / 16</span></div></button></section></main><footer><div id="selected">选择一个方向 · 01—10</div><span>风格探索，非官方品牌标志 / 当前图标尚未替换</span></footer><script>function choose(id,name){document.
